<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>Legacy Mind - AI Personal Assistant</title>
</head>

<body>

    <h1 class="main-heading">
        Welcome to Legacy Mind - AI Personal Assistant!
    </h1>

    <div class="container">

        <!-- Ask Anything -->
        <h2>Ask Anything</h2>

        <form id="askForm">
            <input
                type="text"
                id="questionInput"
                name="question"
                placeholder="Type your question here..."
                required
            >

            <button type="submit">Ask</button>
        </form>

        <p id="ans-loading" class="ask-loading" style="display: none;">
            Processing...
        </p>

        <p id="answer"></p>

        <hr>

        <!-- Email Summarization -->
        <h2>Summarise Email</h2>

        <form id="emailForm">
            <textarea
                id="emailInput"
                name="email"
                placeholder="Paste your email content here..."
                rows="5"
                required
            ></textarea>

            <button type="submit">Summarise</button>
        </form>

        <p id="summary-loading" class="summary-loading" style="display: none;">
            Processing...
        </p>

        <p id="summary"></p>

    </div>

    <script>
        // Ask Anything
        document.getElementById("askForm").onsubmit = async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const loading = document.getElementById("ans-loading");
            const answer = document.getElementById("answer");

            loading.style.display = "block";
            answer.innerText = "";

            try {
                const res = await fetch("/ask", {
                    method: "POST",
                    body: formData
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(
                        data.error || "Failed to get an answer."
                    );
                }

                answer.innerText = data.response;

            } catch (error) {
                answer.innerText =
                    error.message || "Something went wrong. Please try again.";

            } finally {
                loading.style.display = "none";
            }
        };


        // Summarise Email
        document.getElementById("emailForm").onsubmit = async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const loading = document.getElementById("summary-loading");
            const summary = document.getElementById("summary");

            loading.style.display = "block";
            summary.innerText = "";

            try {
                const res = await fetch("/summarize", {
                    method: "POST",
                    body: formData
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(
                        data.error || "Failed to summarize the email."
                    );
                }

                summary.innerText = data.response;

            } catch (error) {
                summary.innerText =
                    error.message || "Something went wrong. Please try again.";

            } finally {
                loading.style.display = "none";
            }
        };
    </script>

</body>

</html>
